name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
        include:
          # macOS as a canary on the latest Python only.
          - python-version: "3.14"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=sil_lift --cov-report=term-missing
      - name: Coverage summary + floor
        # Only run on one matrix leg.
        if: matrix.os == 'macos-latest'
        run: python -m coverage report --format=markdown --fail-under=90 >> "$GITHUB_STEP_SUMMARY"
