# DORMANT: this repo has no remote yet (Phase 3 is local-only, decision D8).
# The workflow is authored so that pushing to a remote later activates CI with
# no restructuring. Until then, the equivalent local command is:
#   python scripts/check.py
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
        include:
          # macOS as a canary on the latest Python only.
          - python-version: "3.14"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=sil_lift --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
