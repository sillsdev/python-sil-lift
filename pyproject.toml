[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sil-lift"
dynamic = ["version"]
description = "Read, write, and validate LIFT (Lexicon Interchange Format) 0.13 lexicon files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SIL Global" }]
keywords = [
  "LIFT",
  "lexicon",
  "lexicography",
  "linguistics",
  "dictionary",
  "FieldWorks",
  "FLEx",
  "SIL",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
# The demo CLI (milestone M7) uses only the stdlib; the extra exists so
# `pip install sil-lift[cli]` is the documented install from day one.
cli = []
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "mypy>=1.14",
  "ruff>=0.8",
  "lxml-stubs",
]
docs = [
  "mkdocs-material>=9",
  "mkdocstrings[python]>=0.27",
  "mkdocs-static-i18n>=1.2",
]

[tool.hatch.version]
path = "src/sil_lift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sil_lift"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
