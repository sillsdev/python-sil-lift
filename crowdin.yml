# Crowdin source/translation mapping (decision B8/D11).
# Crowdin project: https://crowdin.com/project/sil-lift-python
# (owned by SIL account `techops`, created 2026-07-17).
# GitHub integration connected 2026-07-17: syncs `main`; Crowdin delivers
# translations on service branch `crowdin_main` as PRs into `main`
# (merge, then delete the branch — Crowdin recreates it).
# docs/en/ is the only human-edited docs tree; translated trees
# (docs/<lang>/) are machine-managed by Crowdin sync and must never be
# hand-edited in-repo.
files:
- source: /docs/en/**/*.md
  translation: /docs/%two_letters_code%/**/%original_file_name%
