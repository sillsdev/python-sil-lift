# Crowdin project: https://crowdin.com/project/sil-lift-python
#
# GitHub integration syncs `main`. Crowdin delivers translations on
# service branch `crowdin_main` as PRs into `main` (merge, then delete
# the branch — Crowdin recreates it).
#
# docs/en/ is the only human-edited docs tree; translated trees
# (docs/<lang>/) are machine-managed by Crowdin sync and must never be
# hand-edited in-repo.
files:
- source: /docs/en/**/*.md
  translation: /docs/%two_letters_code%/**/%original_file_name%
